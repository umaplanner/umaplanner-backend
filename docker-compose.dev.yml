services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: umaplanner_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umaplanner_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: umaplanner_dev_pgdata
